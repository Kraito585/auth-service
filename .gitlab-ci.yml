# ==============================================================================
# ЭТАП 2: СБОРКА ОБРАЗА
# ==============================================================================
build_production_image:
  stage: build
  tags:
    - k8s-runner
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - echo "Начинаем сборку OCI-образа внутри Kubernetes без Docker демона!"
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" --destination "${CI_REGISTRY_IMAGE}:latest"

# ==============================================================================
# ЭТАП 3: АВТОМАТИЧЕСКИЙ ДЕПЛОЙ
# ==============================================================================
deploy_to_production:
  stage: deploy
  tags:
    - k8s-runner
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - echo "🚀 Инициализация контекста безопасности Kubernetes..."
    - kubectl config set-cluster k8s-cluster --server=https://kubernetes.default.svc.cluster.local:443 --insecure-skip-tls-verify=true
    - kubectl config set-credentials sa-user --token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
    - kubectl config set-context prod-context --cluster=k8s-cluster --user=sa-user --namespace=social
    - kubectl config use-context prod-context

    - echo "📦 Запуск Rolling Update для auth-service..."
    - kubectl set image deployment/auth-service auth-service=${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} -n social

    - kubectl rollout status deployment auth-service -n social --timeout=120s
    - echo "✅ Деплой успешно завершен! Новая версия запущена."
